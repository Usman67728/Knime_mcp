[project]
name = "knime-mcp"
version = "0.1.0"
description = "MCP server for a local KNIME Analytics Platform install: build, execute and inspect KNIME workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.scripts]
knime-mcp = "knime_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knime_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
